[package]
name = 'hashname'
version = '0.1.2'
edition = '2024'

[dependencies]
argparse = '0.2'
sha256 = '1'
rayon = '1'
glob = "0.3"

[profile.release]
opt-level = 3
debug = false
rpath = true
lto = true
debug-assertions = false
codegen-units = 16
panic = 'abort'
incremental = false
overflow-checks = false
strip = 'symbols'
