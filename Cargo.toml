[package]
name = 'hashname'
version = '0.2.0'
edition = '2024'

[dependencies]
argparse = '0.2'
sha2 = { version = "0.11"  }
rayon = '1'
glob = "0.3"

[profile.release]
opt-level = 3
debug = false
rpath = true
lto = true
debug-assertions = false
codegen-units = 16
panic = 'abort'
incremental = false
overflow-checks = false
strip = 'symbols'
